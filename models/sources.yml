version: 1

sources: 
  - name: eth
    description: here is my eth source
    quoting: 
      database: true
      schema: true
    database: ETH
    schema: ETH_SCHEMA
    config: 
      freshness: 
        warn_after: {count: 12, period: hour}
        error_after: {count: 40, period: day}
      loaded_at_field: to_timestamp(date)
    tables: 
      - name: contracts
        identifier: cnt
        description: this is my contracts table of the source eth
        config: 
          freshness: 
            warn_after: {count: 12, period: hour}
            error_after: {count: 180, period: day}
          loaded_at_field: to_timestamp(date)
      - name: contracts_clone
      - name: token_transfers
      - name: transactions
        columns: 
          - name: hash
            data_tests: 
              - unique
  