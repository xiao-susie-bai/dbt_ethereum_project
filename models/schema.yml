
version: 2

models: 
  - name: stg_transactions
    description: Transactions in the Ethereum Blockchain
    columns: 
      - name: hash
        description: >
          *[This is a long multi-line description]* hash is the unique 
          identifier of each transaction in the Ethereum blockchain
        data_tests: 
          - unique
          - not_null
  
  - name: stablecoin_activity_per_day
    latest_version: 1
    config: 
      contract: 
        enforced: true 
        alias_types: true
    columns:
      - name: date
        data_type: date
        description: ""

      - name: token_address
        data_type: string
        description: ""

      - name: type
        data_type: varchar
        description: ""
        data_tests: 
          - accepted_values: 
              arguments: 
                values: ['Hybrid', 'Crypto-backed', 'Fiat-backed']

      - name: symbol
        data_type: varchar
        description: ""

      - name: total_usd_value
        data_type: float
        description: ""
    
    versions: 
      - v: 1
        deprecation_date: 2030-01-01
        # Matches what's above - nothing more needed
      - v: 2
        # Removed a column -- this is a breaking change!
        columns: 
          # This below means: use the 'columns' listed above, but exclude certain columns
          - include: all
            exclude: [token_address, symbol]
  
  - name: stg_transactions_enriched
    columns: 
      - name: value
        data_tests: 
          - assert_value_amount_positive: 
              arguments: 
                field: block_number
  
  - name: stg_token_transfers
    columns: 
      - name: transaction_hash
        data_tests: 
          - relationships: 
              arguments: 
                to: ref('stg_transactions')
                field: hash
              config: 
                severity: warn
                store_failures: true
                store_failures_as: table
                where: date > current_date - 25

unit_tests: 
  - name: test_is_valid_transaction_category_breakdown
    model: stg_transactions_enriched
    overrides: 
      macros: 
        # unit test this model in "full refresh" mode
        is_incremental: false
    given: 
      - input: ref('stg_transactions')
        rows: 
          - {receipt_contract_address: 'erh'}
      - input: ref('stg_token_transfers')
        rows: 
          - {transaction_hash: 'yes'}
    expect: 
      rows: 
        - {transaction_category: 'contract_creation'}
